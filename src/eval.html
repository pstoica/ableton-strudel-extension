<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1a1a1a; color:#aaa; font:12px/1 "SF Pro Text",system-ui,sans-serif; gap:10px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#9db4ff; animation:pulse 1s ease-in-out infinite; }
  .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
  #msg { color:#9db4ff; }
</style>
</head>
<body>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span id="msg">Loading Strudel…</span>
</body>
<script type="module">
const p = new URLSearchParams(location.search);
const pattern = decodeURIComponent(p.get('pattern') ?? '');
const cycles  = parseFloat(p.get('cycles')  ?? '2');
const bpm     = parseFloat(p.get('bpm')     ?? '120');
const msg = document.getElementById('msg');

const isWebKit  = window.webkit?.messageHandlers?.live;
const isWebView2 = window.chrome?.webview;
function close(payload) {
  if (isWebKit)  window.webkit.messageHandlers.live.postMessage({ method:'close_and_send', params:[payload] });
  else if (isWebView2) window.chrome.webview.postMessage({ method:'close_and_send', params:[payload] });
}

try {
  msg.textContent = 'Loading Strudel…';
  console.log('[strudel-ext] loading modules, pattern:', pattern);

  // Load all modules in parallel
  const [coreModule, miniModule, tonalModule] = await Promise.all([
    import('https://esm.run/@strudel/core@1.0.1'),
    import('https://esm.run/@strudel/mini@1.0.1'),
    import('https://esm.run/@strudel/tonal@1.0.1'),
  ]);
  console.log('[strudel-ext] modules loaded, keys:', Object.keys(miniModule).slice(0,8));

  // Build a flat scope from all modules and evaluate via new Function —
  // more reliable than repl().evaluate() which has version-dependent return shapes
  const scope = Object.assign({}, coreModule, miniModule, tonalModule);

  msg.textContent = 'Evaluating…';
  console.log('[strudel-ext] evaluating with scope keys:', Object.keys(scope).filter(k => /^[a-z]/.test(k)).join(', '));

  let pat;
  try {
    // eslint-disable-next-line no-new-func
    const fn = new Function(...Object.keys(scope), `"use strict"; return (${pattern})`);
    pat = fn(...Object.values(scope));
  } catch (evalErr) {
    throw new Error(`Syntax error in pattern: ${evalErr.message}`);
  }

  console.log('[strudel-ext] pat:', pat, 'queryArc?', typeof pat?.queryArc);
  if (!pat || typeof pat.queryArc !== 'function')
    throw new Error(`Pattern did not return a Strudel Pattern. Got: ${JSON.stringify(pat)}`);

  const events = pat.queryArc(0, cycles);
  console.log('[strudel-ext] events:', events.length);

  // 1 cycle = 1 bar = 4 beats (standard 4/4)
  const beatsPerCycle = 4;
  const notes = [];

  for (const e of events) {
    const val = e.value;
    // skip if no note info (e.g. pure CC events)
    const raw = val?.note ?? val?.n ?? val;
    if (raw == null) continue;

    // resolve pitch: could be MIDI number, note name, or object
    let pitch;
    if (typeof raw === 'number') {
      pitch = raw;
    } else if (typeof raw === 'string') {
      // simple note name → MIDI (C4=60)
      const NOTE = {'c':0,'d':2,'e':4,'f':5,'g':7,'a':9,'b':11};
      const m = raw.toLowerCase().match(/^([a-g])(#|b?)(-?\d+)$/);
      if (m) {
        const base = NOTE[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0);
        pitch = base + (parseInt(m[3]) + 1) * 12;
      }
    }
    if (pitch == null || pitch < 0 || pitch > 127) continue;

    const startBeat = +e.part.begin * beatsPerCycle;
    const endBeat   = +e.part.end   * beatsPerCycle;
    const velocity  = Math.round((val?.velocity ?? val?.gain ?? 0.9) * 127);

    notes.push({
      pitch: Math.round(pitch),
      startTime: startBeat,
      duration: Math.max(endBeat - startBeat, 0.0625),
      velocity: Math.min(127, Math.max(1, velocity)),
    });
  }

  close(JSON.stringify({ ok: true, notes, totalBeats: cycles * beatsPerCycle }));
} catch (err) {
  close(JSON.stringify({ ok: false, error: String(err) }));
}
</script>
</html>
