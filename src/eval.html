<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1a1a1a; color:#aaa; font:12px/1 "SF Pro Text",system-ui,sans-serif; gap:10px; }
  .dot { width:6px; height:6px; border-radius:50%; background:#9db4ff; animation:pulse 1s ease-in-out infinite; }
  .dot:nth-child(2){ animation-delay:.2s } .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }
  #msg { color:#9db4ff; }
</style>
</head>
<body>
  <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  <span id="msg">Loading Strudel…</span>
</body>
<script src="/strudel.js"></script>
<script>
const p = new URLSearchParams(location.search);
const pattern   = decodeURIComponent(p.get('pattern') ?? '');
const cycles    = parseFloat(p.get('cycles')  ?? '2');
const bpm       = parseFloat(p.get('bpm')     ?? '120');
const root      = p.get('root')      ?? 'C';
const scaleName = p.get('scale')     ?? 'Major';
const scaleMode = p.get('scaleMode') === '1';
// Strudel scale string e.g. "C4:major" — used when auto-applying to n() patterns
const projectScale = `${root}4:${scaleName.toLowerCase()}`;
const msg = document.getElementById('msg');

const isWebKit  = window.webkit?.messageHandlers?.live;
const isWebView2 = window.chrome?.webview;
function closeDialog(payload) {
  if (isWebKit)  window.webkit.messageHandlers.live.postMessage({ method:'close_and_send', params:[payload] });
  else if (isWebView2) window.chrome.webview.postMessage({ method:'close_and_send', params:[payload] });
}

async function run() {
  try {
    // strudel.js (served locally, no CDN) fires 'strudelready' when done
    if (!window.__strudelReady) {
      msg.textContent = 'Loading Strudel…';
      await new Promise(res => window.addEventListener('strudelready', res, { once: true }));
    }
    msg.textContent = 'Evaluating…';

    // Inject project key/scale as globals — always available regardless of scaleMode.
    // projectScale  → use as: n("0 2 4").scale(projectScale)
    // projectOctave → scale degrees per octave (.add(projectOctave) shifts up one octave)
    const scaleLen = (n => {
      if (/pentatonic/i.test(n)) return 5;
      if (/blues/i.test(n))      return 6;
      if (/chromatic/i.test(n))  return 12;
      return 7; // major / minor / dorian / etc.
    })(scaleName);
    globalThis.projectScale  = projectScale;
    globalThis.projectOctave = scaleLen;
    globalThis.projectRoot   = root;

    // Runtime diagnostic: check if run(1) has .add() on its prototype
    if (typeof run !== 'undefined') {
      const _t = run(1);
      console.log('[strudel-ext] run(1) type:', typeof _t, 'constructor:', _t?.constructor?.name, '.add:', typeof _t?.add, '.slow:', typeof _t?.slow, 'proto methods:', Object.getOwnPropertyNames(_t?.constructor?.prototype||{}).filter(k=>!k.startsWith('_')).slice(0,8).join(','));
    }

  // Preprocess: wrap string args in mini() only for "control source" functions
  // (note, n, s, sound) that store strings as literal control values instead of
  // auto-parsing them. Other functions like run(), add(), cat() etc. are already
  // patternified and handle their own string→mini conversion — wrapping them in
  // mini() produces Pattern-of-Patterns that breaks method chaining.
  const NEEDS_MINI = new Set(['note','n','s','sound','chord']);
  function preprocess(code) {
    // 1. "string".method() → mini("string").method()  (string literal chaining)
    let out = code.replace(
      /("(?:[^"\\]|\\.)*")\s*\./g,
      (match, str) => `mini(${str}).`,
    );
    // 2. Inject scale right after n("string") BEFORE mini-wrapping so there are
    //    no nested parens yet. n("0 2 4") → n("0 2 4").scale("C4:major")
    //    Then step 3 produces: n(mini("0 2 4")).scale("C4:major")
    //    This means every()/gain() chains see already-mapped note values.
    if (scaleMode && !out.includes('.scale(')) {
      out = out.replace(
        /\bn\s*\(\s*("(?:[^"\\]|\\.)*")\s*\)/g,
        (match) => `${match}.scale("${projectScale}")`,
      );
    }
    // 3. func("string") → func(mini("string")) for known control sources
    out = out.replace(
      /\b(\w+)\s*\(\s*("(?:[^"\\]|\\.)*")\s*\)/g,
      (match, fn, str) => (fn !== 'mini' && NEEDS_MINI.has(fn)) ? `${fn}(mini(${str}))` : match,
    );
    return out;
  }

  let pat;
  try {
    const processed = preprocess(pattern);
    console.log('[strudel-ext] original:', pattern);
    console.log('[strudel-ext] preprocessed:', processed);
    pat = (0, eval)(`(${processed})`);
  } catch (evalErr) {
    throw new Error(`Syntax error in pattern: ${evalErr.message}`);
  }

  console.log('[strudel-ext] pat type:', typeof pat, 'queryArc?', typeof pat?.queryArc);
  if (!pat || typeof pat.queryArc !== 'function')
    throw new Error(`Pattern did not return a Strudel Pattern. Got: ${typeof pat}`);

  const events = pat.queryArc(0, cycles);
  console.log('[strudel-ext] events:', events.length);
  if (events.length > 0) {
    // log first 3 events to show value format
    events.slice(0, 3).forEach((e, i) => {
      console.log(`[strudel-ext] event[${i}] value:`, JSON.stringify(e.value), 'part:', +e.part.begin, '-', +e.part.end);
    });
  }

  // 1 cycle = 1 bar = 4 beats (standard 4/4)
  const beatsPerCycle = 4;
  const notes = [];

  let skipped = 0;
  for (const e of events) {
    const val = e.value;
    // skip if no note info (e.g. pure CC events)
    const raw = val?.note ?? val?.n ?? val;
    if (raw == null) continue;

    // resolve pitch: could be MIDI number, note name, or object
    let pitch;
    if (typeof raw === 'number') {
      pitch = Math.round(raw);
    } else if (typeof raw === 'string') {
      const NOTE = {'c':0,'d':2,'e':4,'f':5,'g':7,'a':9,'b':11};
      const m = raw.toLowerCase().match(/^([a-g])(#|b?)(-?\d+)$/);
      if (m) {
        const base = NOTE[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0);
        pitch = base + (parseInt(m[3]) + 1) * 12;
      }
    }
    if (pitch == null) continue;
    if (pitch < 0 || pitch > 127) { skipped++; console.log('[strudel-ext] out-of-range pitch:', pitch, 'from value:', JSON.stringify(val)); continue; }

    const startBeat = +e.part.begin * beatsPerCycle;
    const endBeat   = +e.part.end   * beatsPerCycle;
    // check velocity/vel/gain in that order; Strudel uses 'velocity'/'vel' for MIDI, 'gain' for audio
    const velRaw = val?.velocity ?? val?.vel ?? val?.gain ?? 0.9;
    const velocity = Math.round(velRaw * 127);

    notes.push({
      pitch: Math.round(pitch),
      startTime: startBeat,
      duration: Math.max(endBeat - startBeat, 0.0625),
      velocity: Math.min(127, Math.max(1, velocity)),
    });
  }

  if (skipped) console.log(`[strudel-ext] ${skipped} events skipped (out of MIDI range 0-127)`);
  closeDialog(JSON.stringify({
    ok: true,
    notes,
    totalBeats: cycles * beatsPerCycle,
    _debug: { eventCount: events.length, skipped, firstValue: events[0]?.value ?? null },
  }));
  } catch (err) {
    closeDialog(JSON.stringify({ ok: false, error: String(err) }));
  }
}

run();
</script>
</html>
