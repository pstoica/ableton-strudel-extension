<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: hsl(0,0%,21%); --input-bg: hsl(0,0%,12%); --border: hsl(0,0%,7%);
    --text: hsl(0,0%,71%); --accent: hsl(31,100%,67%); --muted: hsl(0,0%,41%);
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font:500 11.5px/1.4 "AbletonSansSmall",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; }
  body { padding:14px; display:flex; flex-direction:column; gap:10px; overflow:hidden; }
  label { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); }
  input,textarea {
    width:100%; background:var(--input-bg); color:var(--text);
    border:1px solid var(--border); padding:5px 7px; font:inherit; outline:none;
    border-radius:2px;
  }
  input:focus,textarea:focus { border-color:var(--muted); }
  textarea { resize:vertical; min-height:60px; }
  .row { display:flex; gap:8px; }
  button {
    flex:1; background:hsl(0,0%,16%); color:var(--text); border:1px solid var(--border);
    height:20px; border-radius:10px; cursor:pointer; font:inherit; font-size:10.5px;
  }
  button:hover { background:hsl(0,0%,22%); }
  button.primary { background:var(--accent); color:hsl(0,0%,7%); border-color:var(--accent); }
  button.primary:hover { filter:brightness(1.1); }
  #hint { font-size:9.5px; color:var(--muted); }
</style>
</head>
<body>
<label id="labelEl">Pattern</label>
<textarea id="input" placeholder='note("c3 [e3 g3] a3").slow(2)' rows="2"></textarea>
<div id="hint">append @N for cycles · projectScale / projectOctave are globals · n().scale(projectScale).add(12) for octave</div>
<div class="row">
  <button onclick="cancel()">Cancel</button>
  <button class="primary" onclick="confirm()">Evaluate ↵</button>
</div>
<script>
const params = new URLSearchParams(location.search);
const mode = params.get('mode') ?? 'create';
const existing = params.get('existing') ?? '';

if (mode === 'ai') {
  document.getElementById('labelEl').textContent = 'Describe the pattern';
  document.querySelector('textarea').placeholder =
    'dark minor jazz vamp, 4 bars\nor: Dm7 - G7 - Cmaj7, slow(4), jazzy';
  document.getElementById('hint').textContent =
    'natural language or music theory — AI generates the Strudel pattern';
}
if (existing) document.getElementById('input').value = existing;
document.getElementById('input').focus();

const isWebKit   = window.webkit?.messageHandlers?.live;
const isWebView2 = window.chrome?.webview;
function send(payload) {
  if (isWebKit)   window.webkit.messageHandlers.live.postMessage({ method:'close_and_send', params:[payload] });
  else if (isWebView2) window.chrome.webview.postMessage({ method:'close_and_send', params:[payload] });
}
function confirm() { send(JSON.stringify({ value: document.getElementById('input').value.trim() })); }
function cancel()  { send(JSON.stringify({ value: null })); }
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) confirm();
  if (e.key === 'Escape') cancel();
});
</script>
</body>
</html>
